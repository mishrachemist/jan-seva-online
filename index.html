<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jan Seva Online</title>
<meta name="description" content="Private assistance service — PAN, Passport, Driving licence, ITR, Voter ID and land records, in English and 12 Indian languages. Not a government website.">
<meta name="theme-color" content="#4536B0">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Jan Seva">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mukta:wght@500;700;800&family=Hind:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">Jan Seva <span>Online</span></div>
    <div class="who-chip" id="who-chip" hidden><b id="who-name"></b><button class="mini" id="sign-out" data-i18n="signOut">Sign out</button></div>
  </header>
  <div class="disc-row">
    <p class="disc" data-i18n="disclaimer">Private assistance service — not a government website.</p>
    <label class="lang"><span aria-hidden="true">अ/A</span><select id="lang" aria-label="Language"></select></label>
  </div>
  <main id="view" aria-live="polite"><div class="center"><div class="spinner" aria-label="Loading"></div></div></main>
</div>
<nav class="tabs" aria-label="Main" id="tabs" hidden>
  <button class="tab" data-tab="services" aria-current="page"><span data-i18n="tabServices">Services</span></button>
  <button class="tab" data-tab="mine"><span data-i18n="tabMine">My applications</span><span id="mine-dot"></span></button>
  <button class="tab" data-tab="admin" id="admin-tab" hidden>Admin<span id="admin-dot"></span></button>
</nav>
<div class="toast" id="toast" hidden role="status"></div>
<script src="config.js"></script>
<script src="services.js"></script>
<script src="districts.js"></script>
<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
